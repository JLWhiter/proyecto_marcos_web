spring.application.name=repuestos-backend
server.port=5000

# ===== Base de datos (Repuestos Solutions local) =====
spring.datasource.url=jdbc:mysql://localhost:3306/proyecto_marcos_web?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

# ===== JWT =====
app.jwt.secret=dev-jwt-secret-change-me-please-use-env-in-prod
app.jwt.expiration-hours=8
app.jwt.issuer=trucks-inventario
app.jwt.audience=trucks-frontend

# ===== Roles (IDs numéricos, igual que la tabla rol) =====
app.roles.admin=1
app.roles.recepcion=2
app.roles.almacenamiento=3

# ===== CORS (frontend React) =====
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# ===== Uploads =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=./uploads

# ===== Logs =====
logging.level.org.springframework.security=INFO
